name: custom_ticker
description: An implicit animation widget that flips from one number to another, with support for customize styles, decimals and negative values. Includes removeTrailingZeroes parameter.
version: 0.3.4
homepage: https://github.com/gorkem-toprak1/custom-ticker

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.16.9"

dependencies:
  flutter:
    sdk: flutter

screenshots:
  - description: "Animated flip counter (decimal)"
    path: "gifs/percent.gif"
  - description: "Animated flip counter (integer)"
    path: "gifs/counter.gif"
  - description: "Demo flip counter in an app"
    path: "gifs/demo.gif"

dev_dependencies:
  flutter_lints:
  flutter_test:
    sdk: flutter

flutter:
